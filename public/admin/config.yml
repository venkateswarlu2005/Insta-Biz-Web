# Sveltia CMS configuration: https://github.com/sveltia/sveltia-cms
# The owner logs in at https://<site>/admin, edits puppies, and presses Publish.
# Every publish is a Git commit; Cloudflare Pages rebuilds the site in about a minute.

backend:
  name: github
  repo: YOUR-GITHUB-USER/teddypups-website # <- set to the real repository
  branch: main
  # GitHub sign-in helper (free Cloudflare Worker): https://github.com/sveltia/sveltia-cms-auth
  base_url: https://sveltia-cms-auth.YOUR-ACCOUNT.workers.dev # <- set after deploying the worker
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Remove {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'

site_url: https://puppy.instabizweb.com
display_url: https://puppy.instabizweb.com
logo_url: /brand/logo.png

# New photos and videos go to /public/uploads (the build makes small WebP copies automatically).
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      max_file_size: 30000000
      # Shrink phone photos before they are committed, so the repository stays small.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  - name: puppies
    label: Puppies
    label_singular: Puppy
    description: >-
      Every puppy on the site. To mark a puppy as sold, open it and change Status to "Gone home". It moves to the
      Gone home page automatically.
    folder: content/puppies
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{breed}}-{{name}}-{{gender}}'
    identifier_field: breed
    summary: '{{name}} {{breed}} · {{gender}} · {{status}}'
    sortable_fields:
      default:
        field: order
        direction: ascending
      fields: [order, breed, status]
    view_filters:
      - { label: Available, field: status, pattern: available }
      - { label: Reserved, field: status, pattern: reserved }
      - { label: Gone home, field: status, pattern: gone-home }
    view_groups:
      - { label: Status, field: status }
    fields:
      - label: Status
        name: status
        widget: select
        default: available
        options:
          - { label: Available, value: available }
          - { label: Reserved, value: reserved }
          - { label: Gone home, value: gone-home }
      - label: Pet name
        name: name
        widget: string
        required: false
        hint: Optional, e.g. "Max". Leave empty to list the puppy by breed.
      - label: Breed (as shown)
        name: breed
        widget: string
        hint: e.g. "Korean Teacup Maltipoo" or "Maltipoo & Cavapoo"
      - label: Breed filters
        name: breeds
        widget: select
        multiple: true
        min: 1
        hint: Used by the breed filter on the Puppies page.
        options: [Maltipoo, Pomeranian, Poodle, Cavapoo, Shih Tzu, Maltese, Bichon, Pomsky]
      - label: Boy or girl
        name: gender
        widget: select
        options:
          - { label: Boy, value: boy }
          - { label: Girl, value: girl }
          - { label: Boy & girl (pair), value: boy-girl }
      - label: Age
        name: age
        widget: string
        hint: e.g. "2 months"
      - label: Colour
        name: colour
        widget: string
        required: false
      - label: Where
        name: origin
        widget: select
        default: imported
        options:
          - { label: In Dubai (showroom), value: dubai }
          - { label: Imported for you, value: imported }
      - label: Korean Teacup
        name: koreanTeacup
        widget: boolean
        default: false
      - label: Show in home page line-up
        name: hero
        widget: boolean
        default: false
        hint: Up to 6 puppies appear in the line-up at the top of the home page.
      - label: Display order
        name: order
        widget: number
        value_type: int
        default: 1
        hint: Lower numbers appear first.
      - label: Description
        name: description
        widget: text
        required: false
      - label: Photos & videos
        name: media
        widget: list
        min: 1
        summary: '{{type}}: {{alt}}'
        hint: The first photo is the cover.
        fields:
          - label: Type
            name: type
            widget: select
            default: image
            options:
              - { label: Photo, value: image }
              - { label: Video, value: video }
          - label: File
            name: src
            widget: file
          - label: Video cover photo
            name: poster
            widget: image
            required: false
            hint: Only for videos.
          - label: Description (for accessibility)
            name: alt
            widget: string
          - label: Focus point
            name: focus
            widget: string
            required: false
            hint: Optional. Where to crop, e.g. "50% 40%" (left-right, top-bottom).
          - label: Placeholder colour
            name: color
            widget: color
            required: false

  - name: pages
    label: Site content
    files:
      - name: families
        label: Happy families photos
        file: content/families.json
        format: json
        fields:
          - label: Photos
            name: photos
            widget: list
            summary: '{{caption}} {{src}}'
            fields:
              - { label: Photo, name: src, widget: image }
              - { label: Description, name: alt, widget: string, default: A happy TeddyPups family with their new puppy }
              - { label: Caption, name: caption, widget: string, required: false, hint: Leave empty for no caption. }
              - { label: Focus point, name: focus, widget: string, required: false }
              - { label: Placeholder colour, name: color, widget: color, required: false }

      - name: faq
        label: FAQ
        file: content/faq.json
        format: json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: WhatsApp question prefix, name: askText, widget: string }
          - label: Questions
            name: faqs
            widget: list
            summary: '{{question}}'
            fields:
              - { label: ID, name: id, widget: uuid, read_only: true }
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

      - name: settings
        label: Contact details
        file: content/site.json
        format: json
        fields:
          - { label: Brand name, name: brand, widget: string }
          - { label: Short name, name: shortName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Website address, name: siteUrl, widget: string }
          - { label: Phone (as shown), name: phone, widget: string }
          - { label: WhatsApp number (digits only, with country code), name: whatsapp, widget: string, pattern: ['^[0-9]+$', 'Digits only, e.g. 971541676733'] }
          - { label: WhatsApp greeting, name: whatsappGreeting, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Address, name: address, widget: string }
          - { label: About (footer), name: about, widget: text }
          - label: Social links
            name: socials
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
